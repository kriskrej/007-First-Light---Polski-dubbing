[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dub007-pl"
version = "0.9.0rc1"
description = "Tools for the Polish dubbing of 007 First Light"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kris Krej"}]
dependencies = ["lz4==4.4.5", "fonttools==4.60.1"]

[tool.setuptools]
packages = ["dub007"]
