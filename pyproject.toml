[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dub007-pl"
version = "0.1.0.dev0"
description = "Tools for the Polish dubbing of 007 First Light"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kris Krej"}]
dependencies = ["lz4==4.4.5", "fonttools==4.67.0"]

[tool.setuptools]
packages = ["dub007"]
